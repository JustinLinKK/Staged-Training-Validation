[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-preflight"
version = "0.1.0"
description = "CPU-first preflight checks for agent-generated PyTorch training candidates"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Model Preflight contributors" }]
dependencies = [
  "jsonschema>=4.18",
  "PyYAML>=6.0",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-jsonschema>=4.23",
  "types-PyYAML>=6.0",
  "numpy>=1.26",
  "pillow>=10.0",
]

[project.scripts]
model-preflight = "model_preflight.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
model_preflight = [
  "manifest/*.json",
  "reporting/*.json",
  "profiles/*.json",
  "profiles/**/*.yaml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["preflight.py", "plugin.py", "cpu_probe.py", "test_plugin.py", "test_source_*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
packages = ["model_preflight"]
strict = true
warn_unreachable = true
